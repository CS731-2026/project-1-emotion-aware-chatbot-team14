# =============================================================================
# Build configuration
# =============================================================================
# Controls which files the pipeline uses. Edit here instead of the Makefile.

build:
  # Path to the Word template used by `make docx`.
  # Swap this to switch between conference templates without touching the Makefile.
  docx_template: tools/templates/default.docx

  # How the DOCX template is applied:
  #   docxcompose  — fills {{placeholders}} via docxtpl, then appends the pandoc
  #                  body with docxcompose. (current implementation)
  #   custom       — reserved for future custom DOCX generation methods.
  docx_method: docxcompose

  # Citation style (CSL) and bibliography (BIB) shared by both pipelines.
  csl: tools/default.csl
  bib: source/references.bib

  # Pandoc LaTeX template for the primary (PDF) pipeline.
  # Leave commented to use pandoc's built-in default template.
  # Set to tools/templates/ieeetran.latex for proper IEEEtran author blocks
  # (name, dept, org, city, email via \IEEEauthorblockN / \IEEEauthorblockA).
  # Any custom .latex file in tools/templates/ can be used here — see Option 3
  # in BRAINSTORM.md for the image → vibe-code workflow.
  latex_template: tools/templates/ieeetran.latex

  # Explicit ordering of source files included in the paper.
  # If omitted, all source/*.md files are included in alphabetical order.
  # Use this to reorder sections, or to exclude a file from the build.
  content:
    - source/01-introduction.md
    - source/02-methods.md
    - source/03-related-work.md
    - source/04-results.md
    - source/05-discussion.md
    - source/06-conclusion.md

# =============================================================================
# Paper metadata
# =============================================================================
# Content fields injected into the Word template ({{placeholder}} tags)
# and into the LaTeX output via pandoc metadata.

title: "Your Paper Title Here"
subtitle: ""   # leave blank if unused

authors:
  - name: "First Last"
    dept: "Dept. of Computer Science"
    org: "University of Auckland"
    city: "Auckland, New Zealand"
    email: "user@auckland.ac.nz"
  - name: ""
    dept: ""
    org: ""
    city: ""
    email: ""
  - name: ""
    dept: ""
    org: ""
    city: ""
    email: ""

abstract: >
  Write your abstract here. This text will be injected into the Abstract
  placeholder in the Word template. Keep it to one paragraph.

keywords: "keyword1, keyword2, keyword3"

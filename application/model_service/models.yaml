# Local model registry. Paths are relative to the repo root.
# Files live under the gitignored `models/` directory — fetch out-of-band
# (Google Drive / Kaggle / scp / etc.) into the path specified here.
#
# Selected at runtime via the EMOTION_MODEL_ID env var.

models:
  empathbot_final:
    path:    models/empathbot/empath_final.pth
    variant: empathbot

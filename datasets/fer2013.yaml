# FER2013 — Kaggle's reformatted version (msambare/fer2013) ships as
# directory-per-class with PNG/JPG files. ~35k 48x48 grayscale faces,
# 7 classes (angry, disgust, fear, happy, sad, surprise, neutral).
#
# We remap to the EmpathBot 6-class schema and drop disgust (only ~547
# examples and overlaps semantically with distrust).
name: fer2013

source:
  type:        kaggle
  dataset_id:  msambare/fer2013
  # After extract: train/<emotion>/*.jpg, test/<emotion>/*.jpg
  archive_layout:
    train_dir: train
    test_dir:  test

# Target schema (the labels training sees after remap).
class_names: [neutral, trust_relief, sadness, fear_anxiety, confusion, distrust]

# FER2013 source-emotion → target-class. __drop__ means discard examples
# with that source label entirely.
label_remap:
  angry:    distrust
  disgust:  __drop__
  fear:     fear_anxiety
  happy:    trust_relief
  sad:      sadness
  surprise: confusion
  neutral:  neutral

# FER2013 ships only train + test. Carve a validation split off train.
splits:
  val_fraction: 0.10
  by:           random
  seed:         42

# auto = inverse-frequency on the remapped train split, computed at prep time.
class_weights: auto

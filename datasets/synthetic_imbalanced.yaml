# Synthetic imbalanced dataset — same shape as synthetic_smoke but
# with heavily skewed class counts so we can validate class_weights:
# auto actually moves the loss in the right direction. Useful when
# tuning the imbalanced-data path before pointing it at real-world
# datasets where the imbalance is structural (e.g. FER2013's disgust
# class).
name: synthetic_imbalanced

source:
  type:        synthetic
  seed:        7
  image_size:  32
  # Per-class sample counts — neutral dominates, distrust is rare.
  train_samples_per_class:
    neutral:      200
    trust_relief: 80
    sadness:      80
    fear_anxiety: 40
    confusion:    40
    distrust:     20
  # Test set kept balanced so the per-class metrics aren't hidden by
  # the imbalance (otherwise accuracy is misleading).
  test_samples_per_class:   20

class_names: [neutral, trust_relief, sadness, fear_anxiety, confusion, distrust]

label_remap:
  neutral:      neutral
  trust_relief: trust_relief
  sadness:      sadness
  fear_anxiety: fear_anxiety
  confusion:    confusion
  distrust:     distrust

splits:
  val_fraction: 0.10
  seed:         42

class_weights: auto
